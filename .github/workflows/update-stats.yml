name: 生成 README 其它卡片

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: 生成 img/stats.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=SystemFileB&show_icons=true&theme=dark&include_all_commits=true&locale=cn
          path: img/stats.svg

      - name: 生成 img/top-langs.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=SystemFileB&layout=compact&theme=dark&locale=cn&hide=markdown,xslt,html
          path: img/top-langs.svg

      - name: 提交卡片
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/*.svg
          git commit -m "更新 README 卡片" || exit 0
          git push
